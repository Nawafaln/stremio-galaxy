<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stremio Galaxy</title><style>
:root{color-scheme:dark;background:#05040f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040f}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#model{opacity:0}#logo{position:fixed;left:50%;top:50%;width:46vmin;height:46vmin;object-fit:contain;transform:translate(-50%,-50%);opacity:0;filter:drop-shadow(0 0 28px #6354bc80)}
#glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#6848bd38,transparent 50%),radial-gradient(ellipse at 60% 40%,#3685dc20,transparent 65%);pointer-events:none}
#name{position:fixed;left:0;right:0;top:76%;text-align:center;font:600 clamp(16px,2.3vmin,28px) 'Segoe UI',sans-serif;letter-spacing:.19em;color:#e5deff;opacity:0;pointer-events:none}
/* Animated purple and blue nebula behind startup logo */
#intro-nebula {
  position:fixed;
  inset:-20%;
  z-index:0;
  pointer-events:none;
  opacity:.8;
  background:
    radial-gradient(ellipse at 35% 45%,rgba(156,57,224,.46),transparent 35%),
    radial-gradient(ellipse at 68% 55%,rgba(28,105,235,.42),transparent 38%),
    radial-gradient(ellipse at 54% 30%,rgba(115,32,179,.35),transparent 32%),
    radial-gradient(ellipse at 25% 75%,rgba(75,54,188,.27),transparent 35%);
  animation:intro-nebula-motion 18s ease-in-out infinite alternate;
}
@keyframes intro-nebula-motion {
  from {transform:scale(.94) translate3d(-2%,1%,0);}
  to   {transform:scale(1.16) translate3d(2%,-1%,0);}
}
#glow {z-index:1;}
#stars {z-index:2;}
#logo {z-index:3;}
#model {z-index:4;}
#name {z-index:5;}
@media (prefers-reduced-motion:reduce) {
  #intro-nebula {animation:none;}
}
</style></head><body><div id="intro-nebula"></div><div id="glow"></div><canvas id="stars"></canvas><img id="logo" src="logo.webp" alt=""><canvas id="model"></canvas><div id="name">STREMIO GALAXY</div>
<script src="three.min.js"></script><script src="intro.js"></script></body></html>
